{% extends "base.html" %}

{% block title %}删除单词{% endblock %}

{% block content %}
<div class="top-bar">
    <a class="back-link" href="{% url 'word_detail' word.pk %}">← 返回单词详情</a>
    <div class="top-title">删除单词</div>
    <div class="top-subtitle">这个操作确认后不可撤销</div>
</div>

<div class="card">
    <div class="card-title">确认删除？</div>

    <div class="card-desc" style="color: #111827; font-size: 16px;">
        你确定要删除单词：
    </div>

    <div style="
        margin-top: 14px;
        padding: 14px;
        border-radius: 14px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 24px;
        font-weight: 800;
        text-align: center;
    ">
        {{ word.word }}
    </div>
</div>

<form method="post">
    {% csrf_token %}

    <button
        type="submit"
        class="btn"
        style="
            background: #dc2626;
            color: #ffffff;
        "
    >
        确认删除
    </button>

    <a
        href="{% url 'word_detail' word.pk %}"
        class="btn btn-secondary"
        style="margin-top: 10px;"
    >
        取消
    </a>
</form>
{% endblock %}
