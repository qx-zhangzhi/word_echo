{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">删除口语题目</h2>

<div class="alert alert-warning">
    你确定要删除
    <strong>{{ question.title }}</strong>
    吗？
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">确认删除</button>
    <a href="{% url 'speaking_question_detail' question.pk %}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
