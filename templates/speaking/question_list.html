{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>口语问答记录</h2>
    <a href="{% url 'speaking_question_create' %}" class="btn btn-primary">新增题目</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        {% if questions %}
        <table class="table table-striped mb-0 align-middle">
            <thead>
                <tr>
                    <th>标题</th>
                    <th>类型</th>
                    <th>题目</th>
                    <th>练习次数</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for q in questions %}
                <tr>
                    <td>{{ q.title }}</td>
                    <td>{{ q.get_topic_display }}</td>
                    <td>{{ q.question_text|truncatechars:80 }}</td>
                    <td>{{ q.attempts.count }}</td>
                    <td>
                        <a href="{% url 'speaking_question_detail' q.pk %}" class="btn btn-sm btn-outline-primary">详情</a>
                        <a href="{% url 'speaking_question_update' q.pk %}" class="btn btn-sm btn-outline-secondary">编辑</a>
                        <a href="{% url 'speaking_question_delete' q.pk %}" class="btn btn-sm btn-outline-danger">删除</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="p-4 text-muted">还没有口语题目。</div>
        {% endif %}
    </div>
</div>
{% endblock %}
