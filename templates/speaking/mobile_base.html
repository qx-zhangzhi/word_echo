<!-- apps/speaking/templates/speaking/mobile_base.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <!-- 微信浏览器/手机端核心配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>{% block title %}IELTS Speaking{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f5f6f8;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
        }

        body {
            padding-bottom: env(safe-area-inset-bottom);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            min-height: 100vh;
            padding: 14px;
            padding-bottom: 90px;
        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(245, 246, 248, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0 12px;
            margin-bottom: 8px;
        }

        .top-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }

        .top-subtitle {
            margin-top: 4px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.4;
        }

        .section-title {
            margin: 20px 2px 10px;
            color: #374151;
            font-size: 15px;
            font-weight: 700;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
            border: 1px solid #eef0f4;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 6px;
        }

        .card-desc {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            background: #eef2ff;
            color: #3730a3;
            font-size: 12px;
            font-weight: 600;
        }

        .tag.gray {
            background: #f3f4f6;
            color: #4b5563;
        }

        .tag.green {
            background: #ecfdf5;
            color: #047857;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-secondary {
            background: #eef2ff;
            color: #1d4ed8;
        }

        .btn-danger {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-row .btn {
            flex: 1;
        }

        .bottom-action {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            padding: 12px 14px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid #e5e7eb;
            backdrop-filter: blur(10px);
        }

        .textarea {
            width: 100%;
            min-height: 150px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 12px;
            font-size: 16px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            background: #ffffff;
        }

        .textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .audio {
            width: 100%;
            margin-top: 10px;
        }

        .muted {
            color: #6b7280;
            font-size: 14px;
        }

        .score {
            font-size: 26px;
            font-weight: 800;
            color: #2563eb;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 8px;
            color: #2563eb;
            font-size: 15px;
            font-weight: 600;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 40px 10px;
            font-size: 15px;
        }

	.input {
            width: 100%;
            min-height: 46px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 16px;
            outline: none;
            background: #ffffff;
        }
        
        .input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        
        .form-field {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #374151;
        }
        
        .form-help {
            margin-top: 6px;
            color: #6b7280;
            font-size: 13px;
        }
        
        .form-error {
            margin-top: 6px;
            color: #dc2626;
            font-size: 13px;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="page">
        {% block content %}{% endblock %}
    </div>

    {% block bottom_action %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
