<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <!-- 微信浏览器 / 手机端关键配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>{% block title %}Word Echo{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #f5f6f8;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
        }

        body {
            padding-bottom: env(safe-area-inset-bottom);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            min-height: 100vh;
            padding: 16px 14px 28px;
        }

        .mobile-container {
            width: 100%;
        }

        @media (min-width: 640px) {
            .mobile-container {
                max-width: 520px;
                margin: 0 auto;
            }
        }

        .hero {
            padding: 18px 4px 16px;
        }

        .hero-title {
            font-size: 30px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            margin-top: 8px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(245, 246, 248, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0 12px;
            margin-bottom: 8px;
        }

        .top-title {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
        }

        .top-subtitle {
            margin-top: 4px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.4;
        }

        .section-title {
            margin: 20px 2px 10px;
            color: #374151;
            font-size: 15px;
            font-weight: 800;
        }

        .card {
            display: block;
            background: #ffffff;
            border: 1px solid #eef0f4;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        .card-title {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.45;
        }

        .card-desc {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .feature-card {
            min-height: 118px;
            background: #ffffff;
            border: 1px solid #eef0f4;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        .card-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #eef2ff;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .quick-card {
            display: block;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #ffffff;
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
        }

        .quick-title {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.35;
        }

        .quick-desc {
            margin-top: 8px;
            opacity: 0.92;
            font-size: 14px;
            line-height: 1.6;
        }

        .wide-card {
            display: block;
            background: #ffffff;
            border: 1px solid #eef0f4;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        .wide-card-inner {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .wide-icon {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: #ecfdf5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .wide-main {
            flex: 1;
            min-width: 0;
        }

        .wide-title {
            font-size: 17px;
            font-weight: 800;
        }

        .wide-desc {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        .arrow {
            color: #9ca3af;
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-secondary {
            background: #eef2ff;
            color: #1d4ed8;
        }

        .input {
            width: 100%;
            min-height: 46px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 16px;
            outline: none;
            background: #ffffff;
        }

        .textarea {
            width: 100%;
            min-height: 140px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 12px;
            font-size: 16px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            background: #ffffff;
        }

        .input:focus,
        .textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 8px;
            color: #2563eb;
            font-size: 15px;
            font-weight: 700;
        }

        .muted {
            color: #6b7280;
            font-size: 14px;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

	.form-field {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 800;
            color: #374151;
        }
        
        .form-help {
            margin-top: 6px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .form-error {
            margin-top: 6px;
            color: #dc2626;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
        }

        {% block extra_css %}{% endblock %}
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>
<div class="page">
    <div class="mobile-container">
        {% block content %}{% endblock %}
    </div>
</div>

{% block extra_js %}{% endblock %}
</body>
</html>
