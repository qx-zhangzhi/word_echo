{% extends "base.html" %}

{% block title %}删除好句{% endblock %}

{% block content %}
<div class="top-bar">
    <a class="back-link" href="{% url 'phrase_detail' entry.pk %}">← 返回好句详情</a>
    <div class="top-title">删除好句</div>
    <div class="top-subtitle">这个操作确认后不可撤销</div>
</div>

<div class="card">
    <div class="card-title">确认删除？</div>

    <div class="card-desc" style="color: #111827;">
        你确定要删除这条好句吗？
    </div>
</div>

<div class="card">
    <div class="card-title">英文内容</div>

    <div style="
        margin-top: 10px;
        line-height: 1.8;
        font-size: 16px;
        color: #111827;
        word-break: break-word;
    ">
        {{ entry.english_text|linebreaksbr }}
    </div>
</div>

<form method="post">
    {% csrf_token %}

    <button
        type="submit"
        class="btn"
        style="
            background: #dc2626;
            color: #ffffff;
        "
    >
        确认删除
    </button>

    <a href="{% url 'phrase_detail' entry.pk %}" class="btn btn-secondary" style="margin-top: 10px;">
        取消
    </a>
</form>
{% endblock %}
